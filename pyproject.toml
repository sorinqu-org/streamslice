[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "streamslice"
version = "0.1.0"
description = "Automated Twitch to TikTok/Reels/Shorts production pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# OpenCV is only needed to track faces, which only the rendering machine does.
# Without it the pipeline still runs: face tracking reports detector="none" and
# framing falls back to the configured geometry. The host therefore installs the
# core dependencies only.
render = ["opencv-python-headless>=4.10"]
audio = ["librosa>=0.11"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
streamslice = "streamslice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streamslice = ["assets/models/*.onnx"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

# The codebase was written by several hands and drifted apart: three logging
# idioms, blind excepts next to narrow ones, dead imports. These rules are the
# machine-checkable half of keeping it uniform, so the drift cannot come back
# silently. Enforced by `make lint`.
[tool.ruff.lint]
select = [
  "E",     # pycodestyle
  "W",
  "F",     # pyflakes: dead imports, undefined names
  "I",     # import order
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplify
  "RUF",   # ruff-specific
  "BLE",   # blind except
  "S110",  # try-except-pass
  "PIE",
  "FURB",
]
ignore = [
  # Prompts, log messages and subtitle copy are Russian on purpose; every
  # Cyrillic character would otherwise be flagged as "ambiguous".
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Degradation paths deliberately swallow anything an optional pass can raise:
# an unusable enrichment must never fail a render. Each site logs and falls back.
"src/streamslice/pipeline.py" = ["BLE001"]
"src/streamslice/render.py" = ["BLE001"]
"src/streamslice/ffmpeg_render.py" = ["BLE001"]
"tests/*" = ["S110"]

