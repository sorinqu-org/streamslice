extends: default.yaml

sync:
  enabled: false

queue:
  enabled: true
  remote_jobs: gdrive:StreamSlice/render-queue
  remote_results: gdrive:StreamSlice/render-results
  local_root: ~/streamslice/render-queue
  rclone_config: ~/.config/rclone/rclone.conf
  transfers: 4
  checkers: 8
  drive_chunk_size: 64Mi
  max_parallel_renders: 3
  max_parallel_jobs: 1
  sync_timeout_seconds: 7200
  batch_window_minutes: 30
  super_curator_enabled: true
  max_batch_clips: 3
  min_batch_clips: 2
  visual_review_enabled: true

render:
  enabled: true
  engine: ffmpeg
  upscale_encoder: h264_nvenc
  fps: 60
  width: 1080
  height: 1920

youtube:
  auto_upload: true
  cookies_file: ~/.config/streamslice/youtube_cookies.json
  headless: true
  visibility: public
