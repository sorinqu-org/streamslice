# Gameplay-heavy layout: shrinks the webcam down to a small strip so the
# action itself gets most of the vertical frame. Use for clips where the
# gameplay is the whole point (clutch plays, puzzles, big moments).
name: gameplay-focus
description: >
  Small webcam (26%) and large gameplay (74%) split, for clips that are
  carried by the on-screen action rather than the streamer's reaction.

canvas:
  width: 1080
  height: 1920
  fps: 60

layouts:
  split:
    bands:
      - source: webcam
        height: 0.26
        fit: cover
        align_x: 0.5
        align_y: 0.40
        zoom: 1.0
        track: true
        # A 26% strip crops even less of the source than the classic split,
        # so the same conservative upscale cap applies to avoid mush.
        max_upscale: 2.2
        divider_px: 8
        divider_color: "#000000"
      - source: gameplay
        height: 0.74
        fit: cover
        align_x: 0.5
        align_y: 0.5
        zoom: 1.0
        track: true
        max_upscale: 2.5
        divider_px: 0
        divider_color: "#000000"

  webcam_full:
    bands:
      - source: webcam
        height: 1.0
        fit: cover
        align_x: 0.5
        align_y: 0.40
        zoom: 1.0
        track: true
        max_upscale: 2.2
        divider_px: 0
        divider_color: "#000000"

  gameplay_full:
    bands:
      - source: gameplay
        height: 1.0
        fit: cover
        align_x: 0.5
        align_y: 0.5
        zoom: 1.0
        track: true
        max_upscale: 2.5
        divider_px: 0
        divider_color: "#000000"

subtitles: {}
motion: {}
